name = "kocal"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Site statique (index.html, admin.html, scripts/app.js, data/) copié dans public/ par build.mjs.
# Les requêtes /api/* passent d'abord par le Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[build]
command = "node build.mjs"

# Base de données D1 (SQLite managé, stockée dans l'Union européenne)
[[d1_databases]]
binding = "DB"
database_name = "kocal"
database_id = "d492709e-35b7-4076-b152-ed98ebdd033c"

# Vérification toutes les heures : l'envoi a lieu une seule fois par saison, dès 8h (Paris).
[triggers]
crons = ["0 * * * *"]

# Secrets (à définir avec `npx wrangler secret put NOM`, jamais dans ce fichier) :
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER, ADMIN_PASSWORD
